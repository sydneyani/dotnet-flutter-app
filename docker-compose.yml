services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: meridian
      POSTGRES_PASSWORD: meridian
      POSTGRES_DB: meridian
    ports:
      - "5432:5432"
    volumes:
      - meridian-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meridian -d meridian"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Database__Provider: Postgres
      Database__ConnectionString: Host=postgres;Port=5432;Database=meridian;Username=meridian;Password=meridian
      Jwt__SigningKey: dev-only-compose-meridian-signing-key-32
      Seed__Enabled: "true"
      Seed__DemoPassword: Meridian#demo1
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  meridian-pg:
